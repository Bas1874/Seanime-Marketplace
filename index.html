<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seanime Community Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Seanime color tokens (from globals.css) ─── */
    :root {
      --background:  #070707;
      --paper:       rgb(11,11,11);
      --gray-900:    rgb(16,16,16);
      --gray-800:    rgb(28,28,28);
      --gray-700:    rgb(54,54,54);
      --gray-600:    rgb(72,72,72);
      --gray-500:    rgb(90,90,90);
      --gray-400:    rgb(143,143,143);
      --gray-200:    rgb(209,209,209);
      --foreground:  rgb(209,209,209);
      --border:      rgba(255,255,255,0.08);
      --border-md:   rgba(255,255,255,0.12);
      --muted:       rgba(255,255,255,0.4);
      --subtle:      rgba(255,255,255,0.05);
      --subtle-hi:   rgba(255,255,255,0.08);
      --brand:       #8b7cf8;
      --brand-dim:   rgba(97,82,223,0.18);
      --brand-border:rgba(97,82,223,0.35);
      --green:       #4ade80;
      --green-dim:   rgba(74,222,128,0.12);
      --green-border:rgba(74,222,128,0.25);
      --red:         #f87171;
      --red-dim:     rgba(248,113,113,0.12);
      --red-border:  rgba(248,113,113,0.25);
      --orange:      #fb923c;
      --orange-dim:  rgba(251,146,60,0.12);
      --orange-border:rgba(251,146,60,0.25);
      --blue:        #60a5fa;
      --blue-dim:    rgba(96,165,250,0.12);
      --blue-border: rgba(96,165,250,0.25);
      --radius:      0.5rem;
      --radius-xl:   0.75rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--background); color: var(--foreground); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* ─── Nav ─── */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7,7,7,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 600; color: var(--foreground);
      text-decoration: none;
    }
    .nav-logo {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--brand-dim);
      border: 1px solid var(--brand-border);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-logo svg { width: 16px; height: 16px; fill: var(--brand); }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .nav-link {
      display: flex; align-items: center; gap: 6px;
      color: var(--muted); font-size: 13px; font-weight: 500;
      text-decoration: none; padding: 6px 10px; border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .nav-link:hover { color: var(--foreground); background: var(--subtle); }
    .nav-link svg { width: 16px; height: 16px; }

    /* ─── Page shell ─── */
    .page { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* ─── Page header ─── */
    .page-header { margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; color: var(--foreground); }
    .page-header p { font-size: 14px; color: var(--muted); margin-top: 4px; }

    /* ─── Stats row ─── */
    .stats-row { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--subtle); border: 1px solid var(--border);
      border-radius: 99px; padding: 5px 14px; font-size: 13px;
    }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
    .stat-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .stat-dot.red   { background: var(--red);   box-shadow: 0 0 6px var(--red); }
    .stat-dot.gray  { background: var(--gray-500); }
    .stat-count { font-weight: 600; color: var(--foreground); }
    .stat-label { color: var(--muted); }

    /* ─── Controls bar ─── */
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 1.75rem; }
    .controls-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* Rounded-full pill tabs (Seanime style) */
    .tab-group {
      display: inline-flex; align-items: center;
      background: transparent; border: 1px solid var(--border);
      border-radius: 99px; padding: 3px; gap: 1px;
      flex-wrap: wrap;
    }
    .tab-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      padding: 5px 14px; border-radius: 99px;
      color: var(--muted); background: transparent; border: none;
      transition: color .15s, background .15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--foreground); background: var(--subtle); }
    .tab-btn.active { color: var(--foreground); background: var(--subtle-hi); }
    .tab-btn svg { width: 13px; height: 13px; opacity: 0.7; }

    /* Status filter pills */
    .status-group { display: inline-flex; gap: 6px; flex-wrap: wrap; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      padding: 4px 12px; border-radius: 99px;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      transition: all .15s;
    }
    .status-pill:hover { background: var(--subtle); color: var(--foreground); }
    .status-pill.active-all      { border-color: var(--border-md); background: var(--subtle-hi); color: var(--foreground); }
    .status-pill.active-working  { border-color: var(--green-border); background: var(--green-dim); color: var(--green); }
    .status-pill.active-broken   { border-color: var(--red-border); background: var(--red-dim); color: var(--red); }
    .status-pill.active-deprecated{ border-color: var(--orange-border); background: var(--orange-dim); color: var(--orange); }

    /* Search */
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--gray-500); pointer-events: none; }
    .search-inp {
      width: 100%; padding: 7px 12px 7px 34px;
      background: var(--subtle); border: 1px solid var(--border);
      border-radius: 99px; color: var(--foreground); font-size: 13px;
      outline: none; transition: border-color .15s, background .15s;
      font-family: inherit;
    }
    .search-inp::placeholder { color: var(--gray-500); }
    .search-inp:focus { border-color: var(--border-md); background: var(--subtle-hi); }

    /* ─── Section card (groups extensions by type) ─── */
    .section-card {
      background: var(--gray-900); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 1rem; font-weight: 600; color: var(--foreground);
      margin-bottom: 1.25rem;
    }
    .section-header svg { width: 18px; height: 18px; opacity: 0.7; }
    .section-count {
      margin-left: auto; font-size: 12px; font-weight: 500;
      color: var(--muted); background: var(--subtle);
      border: 1px solid var(--border); border-radius: 99px;
      padding: 2px 10px;
    }

    /* ─── Extension grid ─── */
    .ext-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    /* ─── Extension card ─── */
    .ext-card {
      position: relative; overflow: hidden;
      background: var(--paper); border: 1px solid var(--subtle);
      border-radius: var(--radius-xl); padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
      transition: border-color .2s, background .2s;
    }
    .ext-card:hover { border-color: var(--border-md); background: var(--gray-900); }
    .ext-card.status-broken { border-color: rgba(248,113,113,0.15); }
    .ext-card.status-deprecated { border-color: rgba(251,146,60,0.12); }

    /* Card top row: icon + title + action */
    .ext-top { display: flex; align-items: flex-start; gap: 12px; }

    .ext-icon {
      flex-shrink: 0; width: 46px; height: 46px; border-radius: var(--radius);
      background: var(--gray-800); overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: var(--foreground);
      border: 1px solid var(--border);
    }
    .ext-icon img { width: 100%; height: 100%; object-fit: cover; }

    .ext-info { flex: 1; min-width: 0; }
    .ext-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--foreground); }
    .ext-id   { font-size: 11px; color: rgba(255,255,255,0.22); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .ext-action { flex-shrink: 0; }
    .copy-btn {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      padding: 5px 11px; border-radius: var(--radius);
      background: var(--subtle); border: 1px solid var(--border);
      color: var(--muted); transition: all .15s; white-space: nowrap;
    }
    .copy-btn:hover { background: var(--subtle-hi); border-color: var(--border-md); color: var(--foreground); }
    .copy-btn.copied { background: var(--green-dim); border-color: var(--green-border); color: var(--green); }
    .copy-btn svg { width: 12px; height: 12px; }

    /* Description */
    .ext-desc { font-size: 13px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Badge row */
    .ext-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500; padding: 2px 8px;
      border-radius: var(--radius); border: 1px solid;
    }
    .badge-default    { border-color: var(--border); color: var(--muted); background: var(--subtle); }
    .badge-working    { border-color: var(--green-border); color: var(--green); background: var(--green-dim); }
    .badge-broken     { border-color: var(--red-border); color: var(--red); background: var(--red-dim); }
    .badge-deprecated { border-color: var(--orange-border); color: var(--orange); background: var(--orange-dim); }
    .badge-official   { border-color: var(--brand-border); color: var(--brand); background: var(--brand-dim); }
    .badge-blue       { border-color: var(--blue-border); color: var(--blue); background: var(--blue-dim); }
    .badge-vt-clean   { border-color: var(--green-border); color: var(--green); background: var(--green-dim); }
    .badge-vt-flagged { border-color: var(--red-border); color: var(--red); background: var(--red-dim); }
    .badge-vt-unscan  { border-color: var(--border); color: var(--gray-400); background: var(--subtle); }
    .badge-vt-err     { border-color: var(--orange-border); color: var(--orange); background: var(--orange-dim); }

    .badge svg { width: 10px; height: 10px; }

    /* VT link */
    .badge a { color: inherit; text-decoration: none; }
    .badge a:hover { text-decoration: underline; }

    /* Meta line */
    .ext-meta { font-size: 11px; color: rgba(255,255,255,0.25); display: flex; flex-wrap: wrap; gap: 8px; }
    .ext-meta span + span::before { content: '·'; margin-right: 8px; }

    /* ─── Empty / loading ─── */
    .state-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; padding: 3rem; color: var(--muted); font-size: 14px; text-align: center;
    }
    .state-msg svg { width: 40px; height: 40px; opacity: 0.3; }
    .spinner {
      width: 28px; height: 28px; border: 2px solid var(--border);
      border-top-color: var(--brand); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Fade in ─── */
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .fade-in { animation: fadeIn .3s ease-out both; }

    /* ─── Footer ─── */
    .footer { text-align: center; padding: 2rem; font-size: 12px; color: rgba(255,255,255,0.2); border-top: 1px solid var(--border); margin-top: 2rem; }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      .page { padding: 1.25rem 1rem 3rem; }
      .nav { padding: 0 1rem; }
      .tab-group { gap: 0; }
      .tab-btn { padding: 5px 10px; font-size: 12px; }
    }
  </style>
</head>

const ICONS = {

  manga:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>`,
  torrent: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0018 9h-1.26A8 8 0 103 16.29"/></svg>`,
  star:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
};

const SECTION_ICONS = {
  plugin:                 ICONS.plugin,
  'onlinestream-provider':ICONS.stream,
  'manga-provider':       ICONS.manga,
  'anime-torrent-provider':ICONS.torrent,
  official:               ICONS.star,
};

const COPY_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
const SHIELD_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;

let allData = [];
let scanLog = {};
let activeType   = 'all';
let activeStatus = 'all';
let searchTerm   = '';

async function load() {
  try {
    const [mainRes, logRes] = await Promise.allSettled([
      fetch(MAIN_URL), fetch(LOG_URL)
    ]);

    if (mainRes.status === 'fulfilled' && mainRes.value.ok) {
      allData = await mainRes.value.json();
    } else {
      throw new Error('Failed to load extensions');
    }

    if (logRes.status === 'fulfilled' && logRes.value.ok) {
      const log = await logRes.value.json();
      // scanLog keyed by pluginId
      if (Array.isArray(log)) {
        log.forEach(e => { if (e.pluginId) scanLog[e.pluginId] = e; });
      } else if (log && typeof log === 'object') {
        Object.assign(scanLog, log);
      }
    }

    updateStats();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="state-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Could not load extensions. Check back later.</span>
      </div>`;
  }
}

function getStatus(item) {
  // Check for tags field first, then fall back to 'status'
  if (item.tags && Array.isArray(item.tags)) {
    if (item.tags.some(t => /working/i.test(t))) return 'Working';
    if (item.tags.some(t => /broken/i.test(t))) return 'Broken';
    if (item.tags.some(t => /deprecated/i.test(t))) return 'Deprecated';
  }
  if (item.status) return item.status;
  return null;
}

function getVT(item) {
  const log = scanLog[item.id];
  if (!log) return null;
  return { clean: log.vtClean, flagged: log.vtFlagged, permalink: log.vtPermalink };
}

function updateStats() {
  let working = 0, broken = 0;
  allData.forEach(item => {
    const s = getStatus(item);
    if (s === 'Working') working++;
    if (s === 'Broken') broken++;
  });
  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statWorking').textContent = working;
  document.getElementById('statBroken').textContent = broken;

  // Last scan
  const dates = Object.values(scanLog).map(e => e.lastScan || e.scannedAt).filter(Boolean);
  if (dates.length) {
    dates.sort();
    const d = new Date(dates[dates.length - 1]);
    if (!isNaN(d)) {
      document.getElementById('statScan').textContent = d.toLocaleDateString();
      document.getElementById('lastScanPill').style.display = '';
    }
  }
}

function filtered() {
  return allData.filter(item => {
    // Type
    if (activeType === 'official') {
      if (!item.isOfficial && !/^(seanime|island)$/i.test(item.author || '')) return false;
    } else if (activeType !== 'all') {
      if (item.type !== activeType) return false;
    }

    // Status
    if (activeStatus !== 'all') {
      if (getStatus(item) !== activeStatus) return false;
    }

    // Search
    if (searchTerm) {
      const q = searchTerm.toLowerCase();
      if (!(
        (item.name || '').toLowerCase().includes(q) ||
        (item.id   || '').toLowerCase().includes(q) ||
        (item.description || '').toLowerCase().includes(q) ||
        (item.author || '').toLowerCase().includes(q)
      )) return false;
    }

    return true;
  });
}

function copyUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = CHECK_SVG + ' Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = COPY_SVG + ' Copy URL';
    }, 2000);
  });
}

function badgeStatus(status) {
  if (!status) return '';
  const cls = status === 'Working' ? 'badge-working' : status === 'Broken' ? 'badge-broken' : 'badge-deprecated';
  const icon = status === 'Working'
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`
    : status === 'Broken'
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>`;
  return `<span class="badge ${cls}">${icon}${status}</span>`;
}

function badgeVT(vt, permalink) {
  if (!vt) return `<span class="badge badge-vt-unscan">${SHIELD_SVG} Unscanned</span>`;
  if (vt.flagged > 0) {
    const tag = permalink
      ? `<a href="${permalink}" target="_blank" rel="noopener">${SHIELD_SVG} ${vt.flagged} flag${vt.flagged > 1 ? 's' : ''}</a>`
      : `${SHIELD_SVG} ${vt.flagged} flag${vt.flagged > 1 ? 's' : ''}`;
    return `<span class="badge badge-vt-flagged">${tag}</span>`;
  }
  const tag = permalink
    ? `<a href="${permalink}" target="_blank" rel="noopener">${SHIELD_SVG} Clean</a>`
    : `${SHIELD_SVG} Clean`;
  return `<span class="badge badge-vt-clean">${tag}</span>`;
}

function extCard(item) {
  const status = getStatus(item);
  const vt = getVT(item);
  const vtPermalink = vt ? vt.permalink : null;
  const isOfficial = item.isOfficial || /^(seanime|island)$/i.test(item.author || '');

  const statusClass = status === 'Broken' ? 'status-broken' : status === 'Deprecated' ? 'status-deprecated' : '';

  const initials = (item.name || '?')[0].toUpperCase();
  const iconHtml = item.icon
    ? `<img src="${escHtml(item.icon)}" alt="" loading="lazy" onerror="this.style.display='none';this.parentNode.textContent='${initials}'">`
    : escHtml(initials);

  const copyUrl64 = btoa(item.manifestURI || item.manifestUrl || item.url || '');

  const versionBadge = item.version ? `<span class="badge badge-default">${escHtml(item.version)}</span>` : '';
  const authorBadge  = item.author  ? `<span class="badge badge-default">${escHtml(item.author)}</span>`  : '';
  const langBadge    = item.lang && item.lang.toLowerCase() !== 'multi'
    ? `<span class="badge badge-blue">${escHtml(item.lang.toUpperCase())}</span>` : '';
  const officialBadge = isOfficial ? `<span class="badge badge-official">${ICONS.star} Official</span>` : '';
  const seanimeVer = item.seanimeVersion ? `<span>Seanime ${escHtml(item.seanimeVersion)}</span>` : '';
  const lastOk = item.lastWorkingVersion ? `<span>Last OK: ${escHtml(item.lastWorkingVersion)}</span>` : '';

  return `
    <div class="ext-card ${statusClass}" data-url64="${copyUrl64}">
      <div class="ext-top">
        <div class="ext-icon">${iconHtml}</div>
        <div class="ext-info">
          <div class="ext-name">${escHtml(item.name || item.id || 'Unknown')}</div>
          <div class="ext-id">${escHtml(item.id || '')}</div>
        </div>
        <div class="ext-action">
          <button class="copy-btn" onclick="handleCopy(this)">${COPY_SVG} Copy URL</button>
        </div>
      </div>
      ${item.description ? `<div class="ext-desc">${escHtml(item.description)}</div>` : ''}
      <div class="ext-badges">
        ${officialBadge}
        ${badgeStatus(status)}
        ${badgeVT(vt, vtPermalink)}
        ${versionBadge}
        ${authorBadge}
        ${langBadge}
      </div>
      ${(seanimeVer || lastOk) ? `<div class="ext-meta">${seanimeVer}${lastOk}</div>` : ''}
    </div>`;
}

function handleCopy(btn) {
  const card = btn.closest('.ext-card');
  const url = atob(card.dataset.url64 || '');
  if (!url) return;
  copyUrl(url, btn);
}

function sectionHTML(label, iconKey, items, delay) {
  if (!items.length) return '';
  const icon = SECTION_ICONS[iconKey] || SECTION_ICONS.plugin;
  return `
    <div class="section-card fade-in" style="animation-delay:${delay}ms">
      <div class="section-header">
        ${icon}
        ${escHtml(label)}
        <span class="section-count">${items.length}</span>
      </div>
      <div class="ext-grid">
        ${items.map(extCard).join('')}
      </div>
    </div>`;
}

function render() {
  const items = filtered();
  const content = document.getElementById('content');

  if (!items.length) {
    content.innerHTML = `
      <div class="state-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>No extensions match your filters.</span>
      </div>`;
    return;
  }

  let html = '';
  const isOfficial = item => item.isOfficial || /^(seanime|island)$/i.test(item.author || '');

  if (activeType === 'all') {
    const plugins    = items.filter(i => i.type === 'plugin' && !isOfficial(i));
    const streaming  = items.filter(i => i.type === 'onlinestream-provider' && !isOfficial(i));
    const manga      = items.filter(i => i.type === 'manga-provider' && !isOfficial(i));
    const torrents   = items.filter(i => i.type === 'anime-torrent-provider' && !isOfficial(i));
    const official   = items.filter(isOfficial);
    const other      = items.filter(i => !['plugin','onlinestream-provider','manga-provider','anime-torrent-provider'].includes(i.type) && !isOfficial(i));

    html += sectionHTML('Plugins', 'plugin', plugins, 0);
    html += sectionHTML('Online Streaming', 'onlinestream-provider', streaming, 40);
    html += sectionHTML('Manga', 'manga-provider', manga, 80);
    html += sectionHTML('Torrents', 'anime-torrent-provider', torrents, 120);
    html += sectionHTML('Official Extensions', 'official', official, 160);
    if (other.length) html += sectionHTML('Other', 'plugin', other, 200);
  } else if (activeType === 'official') {
    const official = items.filter(isOfficial);
    html += sectionHTML('Official Extensions', 'official', official, 0);
  } else {
    const meta = TYPE_LABEL[activeType] || { label: activeType };
    html += sectionHTML(meta.label, activeType, items, 0);
  }

  content.innerHTML = html || `<div class="state-msg"><span>No extensions found.</span></div>`;
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Controls wiring ───
document.getElementById('typeTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  activeType = btn.dataset.type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});

document.getElementById('statusPills').addEventListener('click', e => {
  const btn = e.target.closest('.status-pill');
  if (!btn) return;
  activeStatus = btn.dataset.status;
  document.querySelectorAll('.status-pill').forEach(b => {
    b.className = 'status-pill';
    if (b === btn) {
      if (activeStatus === 'all')         b.classList.add('active-all');
      else if (activeStatus === 'Working')    b.classList.add('active-working');
      else if (activeStatus === 'Broken')     b.classList.add('active-broken');
      else if (activeStatus === 'Deprecated') b.classList.add('active-deprecated');
    }
  });
  render();
});

document.getElementById('searchInp').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  render();
});

load();
</script>
</body>
</html>
