<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Seanime Community Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          animation: { 'fade-in': 'fadeIn 0.4s ease-out' },
          keyframes: { fadeIn: { '0%': { opacity:'0', transform:'translateY(8px)' }, '100%': { opacity:'1', transform:'translateY(0)' } } }
        }
      }
    };
  </script>
  <style>
    :root {
      --surface:   #0d1117;
      --surface2:  #161b22;
      --surface3:  #1c2128;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.12);
      --blue:      #388bfd;
      --blue-dim:  rgba(56,139,253,0.15);
      --blue-border: rgba(56,139,253,0.3);
    }

    * { box-sizing: border-box; }
    body { background: var(--surface); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glass nav */
    .nav-glass {
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    /* Cards */
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .card:hover {
      border-color: var(--blue-border);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px -8px rgba(56,139,253,0.15), 0 4px 16px -4px rgba(0,0,0,0.4);
    }

    /* Tabs */
    .tab { color: #8b949e; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    .tab:hover { color: #c9d1d9; }
    .tab.active { color: #c9d1d9; border-bottom-color: var(--blue); }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; border: 1px solid; }
    .badge-working    { background: rgba(63,185,80,.12);  border-color: rgba(63,185,80,.3);  color: #3fb950; }
    .badge-broken     { background: rgba(248,81,73,.12);  border-color: rgba(248,81,73,.3);  color: #f85149; }
    .badge-deprecated { background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.3); color: #d29922; }
    .badge-official   { background: rgba(139,100,253,.12);border-color: rgba(139,100,253,.3);color: #a371f7; }
    .badge-vt-clean   { background: rgba(63,185,80,.1);   border-color: rgba(63,185,80,.25); color: #3fb950; }
    .badge-vt-flagged { background: rgba(248,81,73,.1);   border-color: rgba(248,81,73,.25); color: #f85149; }
    .badge-vt-unscan  { background: rgba(110,118,129,.1); border-color: rgba(110,118,129,.2);color: #6e7681; }

    /* Input */
    .inp {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      background: var(--surface); border: 1px solid #30363d;
      color: #c9d1d9; outline: none; font-size: 14px; transition: border-color .15s;
    }
    .inp:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(56,139,253,.12); }
    .inp::placeholder { color: #484f58; }

    /* Buttons */
    .btn-primary { background: var(--blue); color: #fff; border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 500; transition: opacity .15s, transform .1s; }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:active { transform: scale(.97); }
    .btn-install { background: linear-gradient(135deg, #1f6feb, #388bfd); color: #fff; border-radius: 8px; padding: 6px 16px; font-size: 12px; font-weight: 500; transition: opacity .2s, transform .1s; }
    .btn-install:hover { opacity: .85; }
    .btn-install:active { transform: scale(.96); }
    .btn-install:disabled { opacity: .5; cursor: not-allowed; }

    /* Stat cards */
    .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }

    /* Modal overlay */
    .overlay { background: rgba(1,4,9,.85); backdrop-filter: blur(4px); }

    /* Type icon bg */
    .type-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .type-plugin      { background: rgba(56,139,253,.15); }
    .type-online      { background: rgba(63,185,80,.12);  }
    .type-manga       { background: rgba(210,153,34,.12); }
    .type-torrent     { background: rgba(248,81,73,.12);  }
    .type-official    { background: rgba(139,100,253,.12);}

    /* Glow at top */
    .hero-glow {
      position: fixed; top: 0; left: 0; right: 0; height: 320px;
      background: radial-gradient(ellipse 70% 200px at 50% -60px, rgba(56,139,253,.12), transparent);
      pointer-events: none; z-index: 0;
    }
  </style>
</head>
<body class="text-[#c9d1d9] font-sans antialiased min-h-screen flex flex-col" style="background:var(--surface)">
  <div class="hero-glow"></div>

  <!-- ── Nav ── -->
  <nav class="nav-glass sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14 gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-2.5 flex-shrink-0">
          <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,#388bfd,#a371f7)">
            <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <span class="text-[15px] font-semibold text-white">Seanime <span style="color:#8b949e;font-weight:400">Marketplace</span></span>
        </div>

        <!-- Tabs (desktop) -->
        <div class="hidden md:flex items-end gap-1 h-14 overflow-x-auto no-scroll">
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="all">All</button>
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="plugin">Plugins</button>
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="onlinestream-provider">Online Streams</button>
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="manga-provider">Manga</button>
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="anime-torrent-provider">Torrents</button>
          <button class="tab px-4 h-full text-[13px] font-medium whitespace-nowrap" data-tab="official">Official</button>
        </div>

        <!-- GitHub link -->
        <a href="https://github.com/Bas1874/Seanime-Marketplace" target="_blank" rel="noopener noreferrer" title="GitHub" class="flex-shrink-0 p-2 rounded-lg transition hover:bg-white/5" style="color:#8b949e">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
      </div>

      <!-- Tabs (mobile) -->
      <div class="flex md:hidden gap-1 overflow-x-auto no-scroll pb-px">
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="all">All</button>
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="plugin">Plugins</button>
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="onlinestream-provider">Streams</button>
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="manga-provider">Manga</button>
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="anime-torrent-provider">Torrents</button>
        <button class="tab px-3 h-10 text-[12px] font-medium whitespace-nowrap" data-tab="official">Official</button>
      </div>
    </div>
  </nav>

  <!-- ── Search + stats bar ── -->
  <div class="relative z-10 sticky top-14" style="background:rgba(13,17,23,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row gap-3 items-start sm:items-center">
      <!-- Search -->
      <div class="relative w-full sm:max-w-sm">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none" style="color:#484f58" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search" type="search" placeholder="Search plugins, authors..." class="inp pl-9 py-2 text-sm" />
      </div>
      <!-- Filter pills -->
      <div class="flex gap-2 flex-wrap">
        <button class="filter-btn badge badge-working" data-filter="working" style="cursor:pointer;font-size:11px">✓ Working</button>
        <button class="filter-btn badge badge-broken" data-filter="broken" style="cursor:pointer;font-size:11px">✗ Broken</button>
        <button class="filter-btn badge badge-deprecated" data-filter="deprecated" style="cursor:pointer;font-size:11px">⚠ Deprecated</button>
        <button id="clear-filter" class="badge" style="cursor:pointer;font-size:11px;display:none;background:rgba(110,118,129,.1);border-color:rgba(110,118,129,.2);color:#8b949e">✕ Clear</button>
      </div>
      <!-- Stats -->
      <div id="stats-line" class="ml-auto text-xs whitespace-nowrap" style="color:#6e7681"></div>
    </div>
  </div>

  <!-- ── Content ── -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full relative z-10">
    <div id="grid-all"                    class="tab-content grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    <div id="grid-plugin"                 class="tab-content hidden grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    <div id="grid-onlinestream-provider"  class="tab-content hidden grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    <div id="grid-manga-provider"         class="tab-content hidden grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    <div id="grid-anime-torrent-provider" class="tab-content hidden grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    <div id="grid-official"               class="tab-content hidden grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
  </main>

  <!-- ── Toast ── -->
  <div id="toast" class="fixed bottom-6 right-6 z-[60] px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 translate-y-24 transition-transform duration-300 text-sm font-medium" style="background:var(--surface3);border:1px solid var(--border2)">
    <svg id="toast-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
    <span id="toast-msg"></span>
  </div>


  <!-- ── Skeleton template ── -->
  <template id="tpl-skeleton">
    <div class="card p-5 flex flex-col gap-4 animate-pulse">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-lg flex-shrink-0" style="background:var(--surface3)"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3.5 rounded w-3/4" style="background:var(--surface3)"></div>
          <div class="h-3 rounded w-1/2" style="background:var(--surface3)"></div>
        </div>
      </div>
      <div class="space-y-2">
        <div class="h-3 rounded w-full" style="background:var(--surface3)"></div>
        <div class="h-3 rounded w-5/6" style="background:var(--surface3)"></div>
      </div>
      <div class="flex gap-2 mt-auto pt-4" style="border-top:1px solid var(--border)">
        <div class="h-6 w-16 rounded-full" style="background:var(--surface3)"></div>
        <div class="h-6 w-20 rounded-lg ml-auto" style="background:var(--surface3)"></div>
      </div>
    </div>
  </template>

  <!-- ── Card template ── -->
  <template id="tpl-card">
    <div class="card p-5 flex flex-col gap-0 animate-fade-in">
      <!-- Header -->
      <div class="flex items-start gap-3 mb-3">
        <img class="c-icon w-11 h-11 rounded-xl object-cover flex-shrink-0" style="background:var(--surface3);border:1px solid var(--border)" loading="lazy" />
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <h2 class="c-name text-sm font-semibold leading-snug truncate" style="color:#e6edf3"></h2>
            <div class="c-status flex flex-col items-end gap-1 flex-shrink-0"></div>
          </div>
          <p class="c-author text-xs mt-0.5 flex items-center gap-1" style="color:#6e7681">
            <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="c-author-text truncate"></span>
          </p>
        </div>
      </div>

      <!-- Description -->
      <p class="c-desc text-xs leading-relaxed flex-grow line-clamp-3 mb-3" style="color:#8b949e"></p>

      <!-- Meta -->
      <p class="c-meta text-[11px] mb-3" style="color:#484f58"></p>

      <!-- Footer -->
      <div class="flex flex-wrap items-center gap-2 pt-3" style="border-top:1px solid var(--border)">
        <div class="c-vt"></div>
        <div class="flex items-center gap-2 ml-auto">
          <a class="c-website hidden items-center gap-1 text-xs px-3 py-1.5 rounded-lg transition" style="color:var(--blue);background:var(--blue-dim);border:1px solid var(--blue-border)" target="_blank" rel="noopener noreferrer">
            <span>Website</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </a>
          <button class="c-install btn-install hidden">Install</button>
        </div>
      </div>
    </div>
  </template>

  <script>
    const MAIN_JSON = 'https://raw.githubusercontent.com/Bas1874/Seanime-Marketplace/main/Marketplace/Main.json';

    const placeholderSvg = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'>` +
      `<rect width='80' height='80' rx='10' fill='#161b22'/>` +
      `<path d='M40 28v24M28 40h24' stroke='#30363d' stroke-width='2.5' stroke-linecap='round'/>` +
      `</svg>`
    );

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    // ── Toast ─────────────────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, ok = true) {
      const t = $('#toast'), m = $('#toast-msg'), ic = $('#toast-icon');
      m.textContent = msg;
      ic.innerHTML = ok
        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>'
        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
      ic.style.color = ok ? '#3fb950' : '#f85149';
      t.classList.remove('translate-y-24');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add('translate-y-24'), 3000);
    }

    // ── Tabs ──────────────────────────────────────────────────────────────────
    let currentTab = 'all';
    function setTab(id) {
      currentTab = id;
      $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
      $$('.tab-content').forEach(el => el.classList.add('hidden'));
      const el = document.getElementById('grid-' + id);
      if (el) { el.classList.remove('hidden'); }
      applySearch($('#search').value);
    }

    // ── Skeletons ─────────────────────────────────────────────────────────────
    function renderSkeletons(id, n = 8) {
      const c = document.getElementById('grid-' + id);
      if (!c) return;
      c.innerHTML = '';
      const tpl = document.getElementById('tpl-skeleton');
      for (let i = 0; i < n; i++) c.appendChild(tpl.content.cloneNode(true));
    }

    // ── Type helpers ──────────────────────────────────────────────────────────
    const TYPE_LABELS = {
      'plugin': 'Plugin',
      'onlinestream-provider': 'Online Stream',
      'manga-provider': 'Manga',
      'anime-torrent-provider': 'Torrent',
    };
    const TYPE_ICON_SVG = {
      'plugin': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      'onlinestream-provider': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>',
      'manga-provider': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      'anime-torrent-provider': '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
    };
    const TYPE_ICON_COLOR = {
      'plugin': '#388bfd', 'onlinestream-provider': '#3fb950',
      'manga-provider': '#d29922', 'anime-torrent-provider': '#f85149',
    };

    // ── Build one card ────────────────────────────────────────────────────────
    function buildCard(item) {
      const tpl = document.getElementById('tpl-card');
      const n = tpl.content.cloneNode(true);

      // Icon
      const ic = n.querySelector('.c-icon');
      ic.src = item.icon || placeholderSvg;
      ic.onerror = () => { ic.src = placeholderSvg; };

      // Name + author
      n.querySelector('.c-name').textContent  = item.name   || item.id || 'Unnamed';
      n.querySelector('.c-author-text').textContent = item.author || 'Unknown';

      // Description
      n.querySelector('.c-desc').textContent = item.description || 'No description available.';

      // Status badges (top right)
      const statusEl = n.querySelector('.c-status');
      if (item.official)      statusEl.insertAdjacentHTML('beforeend', `<span class="badge badge-official">★ Official</span>`);
      if (item.workingTag)    statusEl.insertAdjacentHTML('beforeend', `<span class="badge badge-working">✓ Working</span>`);
      if (item.brokenTag)     statusEl.insertAdjacentHTML('beforeend', `<span class="badge badge-broken">✗ Broken</span>`);
      if (item.deprecatedTag) statusEl.insertAdjacentHTML('beforeend', `<span class="badge badge-deprecated">⚠ Deprecated</span>`);

      // Meta line
      const metaParts = [`v${item.version || '?'}`];
      if (TYPE_LABELS[item.type]) metaParts.push(TYPE_LABELS[item.type]);
      if (item.scannedOnVersion && item.scannedOnVersion !== 'unknown') metaParts.push(`Seanime v${item.scannedOnVersion}`);
      if (item.lastWorkingVersion) metaParts.push(`Last OK: v${item.lastWorkingVersion}`);
      n.querySelector('.c-meta').textContent = metaParts.join(' · ');

      // VT badge
      const vtEl = n.querySelector('.c-vt');
      const flags = item.flags;
      if (!flags || flags === 'Unscanned') {
        vtEl.innerHTML = `<span class="badge badge-vt-unscan">Unscanned</span>`;
      } else {
        const [det] = flags.split('/').map(Number);
        const cls   = det === 0 ? 'badge-vt-clean' : 'badge-vt-flagged';
        const lbl   = det === 0 ? `✓ ${flags}` : `⚠ ${flags}`;
        if (item.permalink && item.permalink !== 'https://www.virustotal.com/') {
          vtEl.innerHTML = `<a href="${item.permalink}" target="_blank" rel="noopener noreferrer" class="badge ${cls} hover:opacity-80 transition">${lbl}</a>`;
        } else {
          vtEl.innerHTML = `<span class="badge ${cls}">${lbl}</span>`;
        }
      }

      // Website button
      const wsEl = n.querySelector('.c-website');
      if (item.website) { wsEl.href = item.website; wsEl.classList.remove('hidden'); wsEl.classList.add('flex'); }

      // Copy manifest URL button (direct API install is blocked by Seanime's CORS policy)
      const instEl = n.querySelector('.c-install');
      if (item.manifestURI) {
        instEl.classList.remove('hidden');
        instEl.textContent = 'Copy URL';
        instEl.addEventListener('click', () => {
          const ta = document.createElement('textarea');
          ta.value = item.manifestURI;
          ta.style.position = 'fixed'; ta.style.left = '-9999px';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch {}
          document.body.removeChild(ta);
          instEl.textContent = '✓ Copied!';
          instEl.style.background = 'rgba(63,185,80,.15)';
          instEl.style.color = '#3fb950';
          instEl.style.border = '1px solid rgba(63,185,80,.3)';
          showToast('Manifest URL copied — paste it in Seanime → Extensions → Install from URL');
          setTimeout(() => { instEl.textContent = 'Copy URL'; instEl.style = ''; }, 2500);
        });
      }

      return n;
    }

    // ── Load ──────────────────────────────────────────────────────────────────
    const TABS = ['all','plugin','onlinestream-provider','manga-provider','anime-torrent-provider','official'];
    let allItems = [];
    let activeFilter = null;

    async function loadPlugins() {
      TABS.forEach(id => renderSkeletons(id));

      try {
        const res = await fetch(MAIN_JSON);
        if (!res.ok) throw new Error('fetch failed');
        allItems = await res.json();
        if (!Array.isArray(allItems)) throw new Error('not array');
      } catch (e) {
        TABS.forEach(id => {
          const c = document.getElementById('grid-' + id);
          if (c) c.innerHTML = `<div class="col-span-full text-center py-16"><p class="text-sm px-5 py-2.5 rounded-xl inline-block" style="color:#f85149;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.2)">Failed to load marketplace data. Try refreshing.</p></div>`;
        });
        return;
      }

      renderItems();
      updateStats();
    }

    function renderItems() {
      TABS.forEach(id => {
        const c = document.getElementById('grid-' + id);
        if (!c) return;
        c.innerHTML = '';

        let filtered = allItems;
        if (id === 'official') filtered = allItems.filter(x => x.official);
        else if (id !== 'all') filtered = allItems.filter(x => x.type === id);

        if (activeFilter === 'working')    filtered = filtered.filter(x => x.workingTag);
        if (activeFilter === 'broken')     filtered = filtered.filter(x => x.brokenTag);
        if (activeFilter === 'deprecated') filtered = filtered.filter(x => x.deprecatedTag);

        if (!filtered.length) {
          c.innerHTML = `<div class="col-span-full text-center py-12 text-sm" style="color:#6e7681">No plugins match this filter.</div>`;
          return;
        }
        filtered.forEach(item => c.appendChild(buildCard(item)));
      });
    }

    // ── Search ────────────────────────────────────────────────────────────────
    function applySearch(term) {
      const q = term.trim().toLowerCase();
      const activeGrid = document.getElementById('grid-' + currentTab);
      if (!activeGrid) return;
      activeGrid.querySelectorAll('.card:not(.animate-pulse)').forEach(card => {
        card.style.display = (!q || card.innerText.toLowerCase().includes(q)) ? '' : 'none';
      });
    }

    function updateStats() {
      const total   = allItems.length;
      const working = allItems.filter(x => x.workingTag).length;
      const broken  = allItems.filter(x => x.brokenTag).length;
      $('#stats-line').textContent = `${total} extensions · ${working} working · ${broken} broken`;
    }

    // ── Filter pills ──────────────────────────────────────────────────────────
    $$('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const f = btn.dataset.filter;
        if (activeFilter === f) {
          activeFilter = null;
          $$('.filter-btn').forEach(b => b.style.opacity = '1');
          $('#clear-filter').style.display = 'none';
        } else {
          activeFilter = f;
          $$('.filter-btn').forEach(b => b.style.opacity = b.dataset.filter === f ? '1' : '.4');
          $('#clear-filter').style.display = 'inline-flex';
        }
        renderItems();
        applySearch($('#search').value);
      });
    });
    $('#clear-filter').addEventListener('click', () => {
      activeFilter = null;
      $$('.filter-btn').forEach(b => b.style.opacity = '1');
      $('#clear-filter').style.display = 'none';
      renderItems();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
      $$('.tab').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));
      setTab('all');

      let t;
      $('#search').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => applySearch(e.target.value), 100); });

      loadPlugins();
    });
  </script>
</body>
</html>
