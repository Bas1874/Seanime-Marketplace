name: Prerender catalog
on:
  push:
    branches: [main]
    paths:
      - 'Marketplace/Main.json'
      - 'scripts/prerender.mjs'
  schedule:
    - cron: '17 4 * * *'   # daily, keeps "updated Xd ago" text fresh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prerender
  cancel-in-progress: false   # was true — don't kill a run mid-push
jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history; shallow clones can't rebase
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prerender index.html
        run: node scripts/prerender.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          git commit -m "chore: prerender extension catalog"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — syncing with origin/main."
            # docs/index.html is generated, so never merge it — take remote
            # state and rebuild from whatever Main.json now says.
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            node scripts/prerender.mjs
            git add -A
            if git diff --cached --quiet; then
              echo "Remote already up to date — nothing to commit."
              exit 0
            fi
            git commit -m "chore: prerender extension catalog"
            sleep $((i * 3))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
